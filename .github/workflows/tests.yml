name: NetworkRadar tests

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile application and tests
        run: python -m compileall -q networkradar.py networkradar_modules tests scripts
      - name: Check dashboard JavaScript asset
        run: python scripts/check_dashboard_js.py
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v
